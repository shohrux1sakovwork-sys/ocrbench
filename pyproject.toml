[project]
name = "ocrbench"
version = "0.1.0"
description = "OCR benchmark: CER/WER, latency, throughput and memory against OpenAI-compatible OCR endpoints"
authors = [
    { name = "shohrux1sakov", email = "shohrux1sakovwork@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
ocrbench = "ocrbench:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
